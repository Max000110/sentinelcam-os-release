services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sentinelcam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentinelcam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelcam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # 2. Redis Presence & PubSub
  redis:
    image: redis:7-alpine
    container_name: sentinelcam-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # 3. FastAPI WebRTC Signaling & REST API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sentinelcam-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinelcam
      - REDIS_URL=redis://redis:6379/0
      - COTURN_ENABLED=true
      - COTURN_PUBLIC_IP=${VPS_PUBLIC_IP:-127.0.0.1}
      - COTURN_STATIC_AUTH_SECRET=${COTURN_STATIC_AUTH_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ../backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  # 4. Next.js Web Dashboard
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${VPS_PUBLIC_IP:-127.0.0.1}:8000
        NEXT_PUBLIC_WS_URL: ws://${VPS_PUBLIC_IP:-127.0.0.1}:8000
    container_name: sentinelcam-dashboard
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://${VPS_PUBLIC_IP:-127.0.0.1}:8000
      - NEXT_PUBLIC_WS_URL=ws://${VPS_PUBLIC_IP:-127.0.0.1}:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # 5. Coturn STUN/TURN Server
  coturn:
    build:
      context: ../coturn
      dockerfile: Dockerfile
    container_name: sentinelcam-coturn
    restart: unless-stopped
    network_mode: "host"

volumes:
  postgres_data:
