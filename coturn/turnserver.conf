# Coturn Configuration for SentinelCam WebRTC STUN/TURN
listening-port=3478
tls-listening-port=5349

# Realm identifier
realm=sentinelcam.local

# Dynamic Time-Limited HMAC-SHA1 Authentication
use-auth-secret
static-auth-secret=<CHANGE_ME_COTURN_SECRET>

# Relay UDP port range
min-port=49152
max-port=65535

# Verbose logging
verbose
fingerprint
lt-cred-mech

# Security hardening
no-multicast-peers
no-cli
stale-nonce=600

# Do not allow loopback addresses as relay targets
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
